[package]
name = "nr"
version = "0.3.2"
edition = "2024"
description = "A safe, Git-aware NixOS lifecycle CLI"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
terminal_size = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "sync"] }
toml = "0.8"
wait-timeout = "0.2"
