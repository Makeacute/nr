[package]
name = "nr"
version = "0.2.0"
edition = "2024"
description = "A safe, Git-aware NixOS lifecycle CLI"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
terminal_size = "0.4"
toml = "0.8"
