[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nr"
dynamic = ["version"]
description = "A safe, Git-aware NixOS rebuild helper"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Makeacute" }]
dependencies = []

[project.scripts]
nr = "nr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "nr.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
