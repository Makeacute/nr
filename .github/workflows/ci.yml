name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Rustfmt
        run: nix develop --command cargo fmt --check

      - name: Unit tests
        run: nix develop --command cargo test

      - name: Clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: Flake check
        run: nix flake check

      - name: Smoke test cheat
        run: nix run . -- cheat

      - name: Smoke test doctor
        run: nix run . -- doctor --flake .
