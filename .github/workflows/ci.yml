name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Ruff
        run: nix develop --command ruff check src tests

      - name: Unit tests
        run: nix develop --command env PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Flake check
        run: nix flake check

      - name: Smoke test cheat
        run: nix run . -- cheat

      - name: Smoke test doctor
        run: nix run . -- doctor --flake .
